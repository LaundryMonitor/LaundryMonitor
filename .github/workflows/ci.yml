name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Poetry Check
        run: poetry check

      - name: Flake8
        run: poetry run flake8 src/ tests/

      - name: Pytest
        run: poetry run pytest

      - name: Coverage
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Radon CC
        run: poetry run radon cc src/ -a -s

      - name: Complexity Gate
        run: poetry run python scripts/check_complexity.py

      - name: Radon MI
        run: poetry run radon mi src/ -s

      - name: Bandit
        run: poetry run bandit -r src/ -ll

      - name: Locust Smoke
        shell: bash
        env:
          LAUNDRY_MONITOR_DB_PATH: /tmp/laundry_monitor_ci.db
        run: |
          poetry run python scripts/init_db.py
          poetry run python scripts/seed_machines.py
          poetry run uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          trap "kill $BACKEND_PID" EXIT

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/docs > /dev/null; then
              break
            fi
            sleep 1
          done

          poetry run locust -f tests/load/locustfile.py --headless -u 1 -r 1 -t 10s
