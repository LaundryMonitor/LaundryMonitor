[tool.poetry]
name = "laundry-monitor"
version = "0.1.0"
description = "Laundry Monitor backend and Streamlit frontend"
authors = ["Laundry Monitor Team"]
readme = "README.md"
packages = [
    { include = "backend", from = "src" },
    { include = "frontend", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.0"
sqlalchemy = "^2.0.36"
uvicorn = "^0.35.0"
httpx = "^0.28.1"
streamlit = "^1.44.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.11.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
